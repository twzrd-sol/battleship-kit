# /etc/systemd/logind.conf.d/50-powerkey.conf
# STATUS: offered, not yet applied on the origin box.
# A power-button press began a poweroff on a production machine while a VM held
# the GPU. The poweroff stalled and the watchdog reset it. Make the button inert; shut down
# from a shell, after the VM is confirmed off.
[Login]
HandlePowerKey=ignore
